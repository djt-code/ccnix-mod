modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Dan Theisen [WI7FI]"
credits="Built on CC: Tweaked (the CC: Tweaked developers; ComputerCraft by Daniel Ratcliffe) and NeoForge. The ROM includes etlua by Leaf Corcoran (MIT). Inspired by the work of Natanael Copa (Alpine Linux), Rich Felker (musl) and Daniel Stenberg (curl), with thanks."
description='''
ccnix, a small Unix-like distribution for CC: Tweaked, in every computer's ROM, updated with git; and a block that joins ComputerCraft's wired network to a real one, so computers running ccnix's network stack reach real IPv4 hosts. In NAT mode (the default, and singleplayer's) the server's own address stands in for them on the connections they open, with nothing to set up. In TUN mode a TUN device on a Linux server routes them, and real hosts reach them too.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    type="required"
    versionRange="[1.120,)"
    ordering="AFTER"
    side="BOTH"
    # the projects mc-publish links on the sites (the modId alone would name
    # dan200's ComputerCraft of 2017 on both)
    [dependencies.${mod_id}.mc-publish]
        modrinth="cc-tweaked"
        curseforge="cc-tweaked"

# Used by ccnix's Lua (lib/mc: the chat box, player and environment detectors)
# when it's there; nothing in the mod needs it, so any version will do.
[[dependencies.${mod_id}]]
    modId="advancedperipherals"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
    [dependencies.${mod_id}.mc-publish]
        modrinth="advancedperipherals"
        curseforge="advanced-peripherals"
