# The server: the dma.space pack (DMA 1.5) with the ccnix mod.
neoforge_version: "21.1.256"
java_package: openjdk-21-jre-headless      # NeoForge 1.21.1 wants Java 21 exactly

minecraft_user: minecraft                  # runs the server, and the gateway's helper under it
minecraft_home: /srv/minecraft
minecraft_dir: /srv/minecraft/server
minecraft_heap_min: 2G
minecraft_heap_max: 5G                     # the VM has 7 GB
# more JVM options.  preferIPv4Stack: the LAN advertises an IPv6 route that
# goes nowhere, and Java tried it first for Mojang's session server, so
# every login failed with "Authentication servers are down".
minecraft_jvm_options: ["-Djava.net.preferIPv4Stack=true"]
minecraft_ports: ["25565/tcp", "24454/udp"]   # the game; Simple Voice Chat

# server.properties keys to keep as given (the server writes the rest)
server_properties:
  motd: "dma.space dev (ccnix)"
  online-mode: "true"

# The bundle from helper/server-bundle.sh, on the controller: mods/,
# config/, defaultconfigs/.  Pass -e ccnix_bundle=... or set it here.
ccnix_bundle: "{{ playbook_dir }}/../server-bundle.tar.gz"

# The Network Gateway (config/ccnix-server.toml) and the TUN device under it
ccnix_gateway_address: 10.0.0.1/24
ccnix_gateway_channel: 4040
ccnix_gateway_mac: gateway
ccnix_gateway_routes: ["10.1.0.0/16 via 10.0.0.2"]   # CC networks behind CC routers
ccnix_tun_device: ccnix0
# Routed into the device on the server, in a routing table of their own
# (ccnix_tun_table) that the host's own routes come before.  Every gateway
# route, ops' too, has to be inside one of these.
ccnix_tun_networks: ["10.0.0.0/8"]
ccnix_tun_table: 4040
ccnix_forward: true             # the server routes between CC's networks and its LAN
ccnix_nat: ""                   # an uplink name (eth0) to masquerade CC's networks out of it

# Who owns the gateway's routes.  ccnix_op_routes: ops may change them in
# game (/ccnix route add|del), within ccnix_tun_networks and no larger
# than a /ccnix_op_route_max_subnet.  ccnix_ansible_routes: every run sets
# them to ccnix_gateway_routes, replacing what ops changed; off, the play
# writes them only into a new config and leaves them alone after.
ccnix_op_routes: true
ccnix_op_route_max_subnet: 16
ccnix_ansible_routes: false
