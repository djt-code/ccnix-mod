# The dma.space dev server with ccnix, on Ubuntu 26.04.
#
#   helper/server-bundle.sh "<CurseForge instance>"    (the server's mods and configs)
#   cd ansible && ansible-playbook site.yml [-e ccnix_bundle=...]
#
# From Windows without WSL: ansible/run-on-host.sh copies this and the
# bundle to the host and runs it there.  Running it again changes nothing
# unless the bundle or the variables changed; a new bundle replaces mods/
# (and the pack's config/) with the server stopped.
- name: Minecraft dev server (dma.space + ccnix)
  hosts: minecraft
  become: true
  vars:
    neoforge_args: "{{ minecraft_dir }}/libraries/net/neoforged/neoforge/{{ neoforge_version }}/unix_args.txt"

  tasks:
    - name: Packages
      ansible.builtin.apt:
        name: ["{{ java_package }}", gcc, libc6-dev, iptables, tmux, acl, curl, git]   # git: /ccnix rom update
        update_cache: true
        cache_valid_time: 3600

    - name: The service account
      ansible.builtin.user:
        name: "{{ minecraft_user }}"
        system: true
        home: "{{ minecraft_home }}"
        shell: /usr/sbin/nologin
        create_home: true

    # The gateway's helper and the TUN device it holds (TUN mode; in NAT
    # mode the device is taken down and the unit left disabled)
    - name: Helper source
      ansible.builtin.copy:
        src: ../helper/ccnix-tun.c
        dest: /usr/local/src/ccnix-tun.c
        mode: "0644"
      register: helper_src

    - name: Build ccnix-tun
      ansible.builtin.command: cc -O2 -Wall -o /usr/local/bin/ccnix-tun /usr/local/src/ccnix-tun.c
      when: helper_src.changed
      notify: Restart minecraft

    - name: ccnix-tun-setup
      ansible.builtin.copy:
        src: ../helper/ccnix-tun-setup
        dest: /usr/local/sbin/ccnix-tun-setup
        mode: "0755"
      notify: Restart ccnix-tun

    - name: ccnix-tun.service
      ansible.builtin.template:
        src: ccnix-tun.service.j2
        dest: /etc/systemd/system/ccnix-tun.service
        mode: "0644"
      notify: Restart ccnix-tun

    # systemd-networkd drops rules it didn't make whenever it starts, and
    # needrestart restarts it after some upgrades: the table's two rules
    # went with it, so the host stopped routing into the device
    - name: networkd leaves the rules alone (TUN mode)
      ansible.builtin.copy:
        dest: /etc/systemd/networkd.conf.d/ccnix.conf
        content: |
          # From ccnix-mod's playbook (ansible/site.yml)
          # ccnix-tun-setup's policy rules (priorities {{ ccnix_tun_table }} and {{ ccnix_tun_table | int + 1 }}) aren't networkd's
          [Network]
          ManageForeignRoutingPolicyRules=no
        mode: "0644"
      when: ccnix_gateway_mode == "tun"

    - name: networkd as it was (NAT mode)
      ansible.builtin.file:
        path: /etc/systemd/networkd.conf.d/ccnix.conf
        state: absent
      when: ccnix_gateway_mode == "nat"

    - name: The TUN device, now and at every boot (TUN mode)
      ansible.builtin.systemd_service:
        name: ccnix-tun
        enabled: true
        state: started
        daemon_reload: true
      when: ccnix_gateway_mode == "tun"

    - name: No TUN device (NAT mode)
      ansible.builtin.systemd_service:
        name: ccnix-tun
        enabled: false
        state: stopped
        daemon_reload: true
      when: ccnix_gateway_mode == "nat"

    - name: The device, its table and rules taken down (NAT mode)
      ansible.builtin.command:
        cmd: /usr/local/sbin/ccnix-tun-setup --remove
        removes: "/sys/class/net/{{ ccnix_tun_device }}"
      environment:
        DEVICE: "{{ ccnix_tun_device }}"
        TABLE: "{{ ccnix_tun_table }}"
      when: ccnix_gateway_mode == "nat"

    # NeoForge
    - name: Server folder
      ansible.builtin.file:
        path: "{{ minecraft_dir }}"
        state: directory
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0755"

    # The world on its own disk (minecraft_world_disk).  A world already
    # on the root disk isn't moved: the play stops at it (README.md says
    # how to move it) rather than mount over it.
    - name: The world's disk's filesystem
      ansible.builtin.command: blkid -o value -s TYPE {{ minecraft_world_disk }}
      register: world_fs
      changed_when: false
      failed_when: world_fs.rc not in [0, 2]     # 2: none yet
      when: minecraft_world_disk != ""

    - name: An ext4 filesystem on it, if it has none
      ansible.builtin.command: mkfs.ext4 -q -L mcdata {{ minecraft_world_disk }}
      when: minecraft_world_disk != "" and world_fs.stdout == ""

    - name: Its UUID, and what's mounted already
      ansible.builtin.command: "{{ item }}"
      loop:
        - blkid -o value -s UUID {{ minecraft_world_disk }}
        - findmnt -n {{ minecraft_data_dir }}
        - findmnt -n {{ minecraft_dir }}/world
      register: world_state
      changed_when: false
      failed_when: false
      when: minecraft_world_disk != ""

    - name: What's in the server's world/, if that isn't mounted
      ansible.builtin.find:
        paths: "{{ minecraft_dir }}/world"
        file_type: any
      register: world_files
      when: minecraft_world_disk != "" and world_state.results[2].rc != 0

    - name: No world on the root disk to hide
      ansible.builtin.fail:
        msg: >-
          {{ minecraft_dir }}/world holds a world on the root disk: stop the
          server, move it onto the disk (ansible/README.md), and run the play again
      when: minecraft_world_disk != "" and world_state.results[2].rc != 0 and world_files.matched > 0

    - name: The disk and the world in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^\\S+ {{ item.path }} "
        line: "{{ item.src }} {{ item.path }} {{ item.type }} {{ item.opts }} 0 {{ item.pass }}"
      loop:
        - { src: "UUID={{ world_state.results[0].stdout }}", path: "{{ minecraft_data_dir }}", type: ext4, opts: "defaults,noatime", pass: 2 }
        - { src: "{{ minecraft_data_dir }}/world", path: "{{ minecraft_dir }}/world", type: none, opts: bind, pass: 0 }
      loop_control:
        label: "{{ item.path }}"
      when: minecraft_world_disk != ""

    - name: The disk mounted
      ansible.builtin.command: mount {{ minecraft_data_dir }}
      when: minecraft_world_disk != "" and world_state.results[1].rc != 0

    - name: Its world/, and the server's (the mount point)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0755"
      loop: ["{{ minecraft_data_dir }}", "{{ minecraft_data_dir }}/world", "{{ minecraft_dir }}/world"]
      when: minecraft_world_disk != ""

    - name: The world mounted
      ansible.builtin.command: mount {{ minecraft_dir }}/world
      when: minecraft_world_disk != "" and world_state.results[2].rc != 0

    - name: NeoForge installer
      ansible.builtin.get_url:
        url: "https://maven.neoforged.net/releases/net/neoforged/neoforge/{{ neoforge_version }}/neoforge-{{ neoforge_version }}-installer.jar"
        dest: "{{ minecraft_home }}/neoforge-{{ neoforge_version }}-installer.jar"
        owner: "{{ minecraft_user }}"
        mode: "0644"

    - name: Install NeoForge {{ neoforge_version }}
      ansible.builtin.command:
        cmd: java -jar {{ minecraft_home }}/neoforge-{{ neoforge_version }}-installer.jar --install-server .
        chdir: "{{ minecraft_dir }}"
        creates: "{{ neoforge_args }}"
      become_user: "{{ minecraft_user }}"
      notify: Restart minecraft

    # The pack's mods and configs, with ccnix
    - name: The bundle
      ansible.builtin.copy:
        src: "{{ ccnix_bundle }}"
        dest: "{{ minecraft_home }}/server-bundle.tar.gz"
        owner: "{{ minecraft_user }}"
        mode: "0644"
      register: bundle

    - name: Stop the server for the new mods
      ansible.builtin.systemd_service:
        name: minecraft
        state: stopped
      when: bundle.changed
      failed_when: false             # (not there yet on the first run)

    - name: Clear the old mods
      ansible.builtin.file:
        path: "{{ minecraft_dir }}/mods"
        state: absent
      when: bundle.changed

    - name: Unpack the bundle
      ansible.builtin.unarchive:
        src: "{{ minecraft_home }}/server-bundle.tar.gz"
        dest: "{{ minecraft_dir }}"
        remote_src: true
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
      when: bundle.changed
      notify: Restart minecraft

    # The mod rewrites this file with its own comments, so it's written
    # whole only when missing, and after that just the keys are kept as
    # set (the mod reloads them while the server runs).  The routes only
    # with ccnix_ansible_routes: else they're the ops' (/ccnix route).
    - name: The gateway's config, if there's none
      ansible.builtin.template:
        src: ccnix-server.toml.j2
        dest: "{{ minecraft_dir }}/config/ccnix-server.toml"
        owner: "{{ minecraft_user }}"
        mode: "0644"
        force: false

    - name: The config's sections, for keys a newer mod adds
      ansible.builtin.lineinfile:
        path: "{{ minecraft_dir }}/config/ccnix-server.toml"
        line: "[nat]"
        insertbefore: "^\\[tun\\]"

    - name: The gateway's settings
      ansible.builtin.lineinfile:
        path: "{{ minecraft_dir }}/config/ccnix-server.toml"
        regexp: "^\\s*{{ item.key }} = "
        line: "\t{{ item.key }} = {{ item.value }}"
        insertafter: "^\\[{{ item.section }}\\]"      # (a key the file doesn't have yet: in its section)
      loop: "{{ ccnix_settings + (ccnix_routes if ccnix_ansible_routes | bool else [])
        + (ccnix_forwards if ccnix_ansible_forwards | bool else []) }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        ccnix_settings:
          - { section: gateway, key: mode, value: '"{{ ccnix_gateway_mode }}"' }
          - { section: gateway, key: networks, value: "[{{ ccnix_cc_networks | map('to_json') | join(', ') }}]" }
          - { section: gateway, key: sourceCheck, value: "{{ ccnix_source_check | bool | lower }}" }
          - { section: gateway, key: address, value: '"{{ ccnix_gateway_address }}"' }
          - { section: gateway, key: channel, value: "{{ ccnix_gateway_channel }}" }
          - { section: gateway, key: mac, value: '"{{ ccnix_gateway_mac }}"' }
          - { section: gateway, key: opRoutes, value: "{{ ccnix_op_routes | bool | lower }}" }
          - { section: gateway, key: opMaxSubnet, value: "{{ ccnix_op_route_max_subnet }}" }
          - { section: gateway, key: vlans, value: '"{{ ccnix_gateway_vlans }}"' }
          - { section: gateway, key: maxPerPlayer, value: "{{ ccnix_gateway_max_per_player }}" }
          - { section: nat, key: deny, value: "[{{ ccnix_nat_deny | map('to_json') | join(', ') }}]" }
          - { section: nat, key: allow, value: "[{{ ccnix_nat_allow | map('to_json') | join(', ') }}]" }
          - { section: nat, key: maxPerComputer, value: "{{ ccnix_nat_max_per_computer }}" }
          - { section: nat, key: maxTotal, value: "{{ ccnix_nat_max_total }}" }
          - { section: nat, key: tcpIdle, value: "{{ ccnix_nat_tcp_idle }}" }
          - { section: nat, key: udpIdle, value: "{{ ccnix_nat_udp_idle }}" }
          - { section: nat, key: dnsRelay, value: '"{{ ccnix_nat_dns_relay }}"' }
          - { section: nat, key: opForwards, value: "{{ ccnix_nat_op_forwards | bool | lower }}" }
          - { section: nat, key: opForwardPorts, value: '"{{ ccnix_nat_op_forward_ports }}"' }
          - { section: tun, key: helper, value: '"ccnix-tun"' }
          - { section: tun, key: device, value: '"{{ ccnix_tun_device }}"' }
        ccnix_routes:
          - { section: gateway, key: routes, value: "[{{ ccnix_gateway_routes | map('to_json') | join(', ') }}]" }
        ccnix_forwards:
          - { section: nat, key: forwards, value: "[{{ ccnix_nat_forwards | map('to_json') | join(', ') }}]" }

    # CC: Tweaked's own config: computers' screens, [term_sizes.computer] only
    # (pocket computers and monitors have their own).
    - name: Is there a CC config?
      ansible.builtin.stat:
        path: "{{ minecraft_dir }}/config/computercraft-server.toml"
      register: cc_config

    - name: A CC config with the screen size, if there's none (CC fills in the rest)
      ansible.builtin.copy:
        content: "[term_sizes]\n\t[term_sizes.computer]\n\t\twidth = {{ ccnix_cc_term_width }}\n\t\theight = {{ ccnix_cc_term_height }}\n"
        dest: "{{ minecraft_dir }}/config/computercraft-server.toml"
        owner: "{{ minecraft_user }}"
        mode: "0644"
      when: not cc_config.stat.exists
      notify: Restart minecraft

    - name: Computers' screen size
      ansible.builtin.replace:
        path: "{{ minecraft_dir }}/config/computercraft-server.toml"
        regexp: '(\[term_sizes\.computer\][^\[]*?\b{{ item.key }}\s*=\s*)\d+'
        replace: '\g<1>{{ item.value }}'
      loop:
        - { key: width, value: "{{ ccnix_cc_term_width }}" }
        - { key: height, value: "{{ ccnix_cc_term_height }}" }
      loop_control:
        label: "{{ item.key }} {{ item.value }}"
      when: cc_config.stat.exists
      notify: Restart minecraft

    # Writing eula=true means you accept the Minecraft EULA
    # (https://aka.ms/MinecraftEULA): read it first.  The play writes it
    # only with minecraft_eula_accepted set true; until eula.txt says true,
    # the server won't start.
    - name: eula.txt
      ansible.builtin.copy:
        content: "eula=true\n"
        dest: "{{ minecraft_dir }}/eula.txt"
        owner: "{{ minecraft_user }}"
        mode: "0644"
      when: minecraft_eula_accepted | default(false) | bool

    - name: user_jvm_args.txt
      ansible.builtin.copy:
        content: "-Xms{{ minecraft_heap_min }} -Xmx{{ minecraft_heap_max }} {{ minecraft_jvm_options | join(' ') }}\n"
        dest: "{{ minecraft_dir }}/user_jvm_args.txt"
        owner: "{{ minecraft_user }}"
        mode: "0644"
      notify: Restart minecraft

    - name: server.properties
      ansible.builtin.lineinfile:
        path: "{{ minecraft_dir }}/server.properties"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: true
        owner: "{{ minecraft_user }}"
        mode: "0644"
      loop: "{{ server_properties | dict2items }}"
      notify: Restart minecraft

    # The service and its console
    - name: minecraft.service
      ansible.builtin.template:
        src: minecraft.service.j2
        dest: /etc/systemd/system/minecraft.service
        mode: "0644"
      notify: Restart minecraft

    - name: mc-console and mc-cmd
      ansible.builtin.copy:
        dest: "/usr/local/bin/{{ item.name }}"
        mode: "0755"
        content: |
          #!/bin/sh
          # {{ item.what }}
          {{ item.run }}
      loop:
        - name: mc-console
          what: "the server's console (Ctrl+B D leaves it running)"
          run: exec sudo -u {{ minecraft_user }} tmux attach -t mc
        - name: mc-cmd
          what: 'type a command at the server''s console: mc-cmd "op somebody"'
          run: exec sudo -u {{ minecraft_user }} tmux send-keys -t mc "$*" Enter

    - name: Is ufw on?
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Firewall, if ufw is on
      ansible.builtin.command: ufw allow {{ item }}
      loop: "{{ minecraft_ports }}"
      when: "'Status: active' in ufw_status.stdout"
      register: ufw
      changed_when: "'Skipping' not in ufw.stdout"

    # (a restart the changes above asked for happens here, so the server
    # isn't started below and then restarted again at the end)
    - name: Restart what changed
      ansible.builtin.meta: flush_handlers

    - name: The server, now and at every boot
      ansible.builtin.systemd_service:
        name: minecraft
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart ccnix-tun
      ansible.builtin.systemd_service:
        name: ccnix-tun
        state: restarted
        daemon_reload: true
      when: ccnix_gateway_mode == "tun"

    - name: Restart minecraft
      ansible.builtin.systemd_service:
        name: minecraft
        state: restarted
        daemon_reload: true
