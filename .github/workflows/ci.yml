# The checks every pull request and every push to main must pass (ADR-0009 in
# ccnix): the mod built with the ROM from the ccnix/ submodule and its tests,
# and the TUN helper compiled. After a green run on main, the release job
# makes release vX.Y.Z for mod_version, with the jar, if there isn't one yet
# (D5, D6).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:              # (to retry a release: runs on main's tip)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never a run on main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.versions.outputs.version }}
      rom: ${{ steps.versions.outputs.rom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true          # ccnix/, which the ROM is built from (not recursive)
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: build and test
        run: ./gradlew build
      - name: the TUN helper
        run: cc -O2 -Wall -Werror -o /tmp/ccnix-tun helper/ccnix-tun.c
      - name: the versions (the mod's, and the ccnix its ROM is)
        id: versions
        run: |
          echo "version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "rom=$(tr -d '[:space:]' < ccnix/deploy/version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccnix-jar
          path: |
            build/libs/ccnix-*.jar
            !build/libs/ccnix-*-sources.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # the tag and the release; nothing else may write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      ROM: ${{ needs.build.outputs.rom }}
    steps:
      - name: out already?
        id: out
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ccnix-mod v$VERSION is out already: nothing to do"
            echo "out=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.out.outputs.out != 'true'
        with:
          name: ccnix-jar
          path: jar
      - name: the GitHub release, with the jar
        if: steps.out.outputs.out != 'true'
        run: |
          gh release create "v$VERSION" "jar/ccnix-$VERSION.jar" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ccnix-mod v$VERSION" \
            --notes "The ROM: ccnix v$ROM. For Minecraft 1.21.1, NeoForge, with CC: Tweaked 1.120 or later." \
            --generate-notes
