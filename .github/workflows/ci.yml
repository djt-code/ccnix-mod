# The checks every pull request and every push to main must pass (ADR-0009 in
# ccnix): the mod built with the ROM from the ccnix/ submodule and its tests,
# and the TUN helper compiled.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never a run on main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true          # ccnix/, which the ROM is built from (not recursive)
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: build and test
        run: ./gradlew build
      - name: the TUN helper
        run: cc -O2 -Wall -Werror -o /tmp/ccnix-tun helper/ccnix-tun.c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccnix-jar
          path: |
            build/libs/ccnix-*.jar
            !build/libs/ccnix-*-sources.jar
          if-no-files-found: error
