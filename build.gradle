plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup('cc.tweaked') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The dev server's console takes what's typed into Gradle's.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"
    runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"

    // The tests run ccnix's lib/net.lua in Cobalt, CC's Lua VM.
    testImplementation "cc.tweaked:cobalt:${cobalt_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// ccnix's Lua, for the ROM and the tests: the ccnix/ submodule (git submodule
// update --init ccnix), or, with that not checked out, the ccnix repo this is
// the mod/ submodule of, or one beside this
def luaRepo = [file('ccnix'), file('..'), file('../ccnix')].find { new File(it, 'lib/net.lua').exists() } ?: file('ccnix')

test {
    useJUnitPlatform()
    systemProperty 'ccnix.net', new File(luaRepo, 'lib/net.lua').absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            cct_version            : cct_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The ROM: ccnix's programs as committed at that repo's HEAD, the submodule's
// commit (git archive, so local edits and line endings don't come along),
// into ccnix-rom/ with an
// index of the files, and ccnix-rom.properties: the commit, its time, and
// the repo and branch computers pull their updates from.
def romPaths = ['bin', 'lib', 'turtle', 'pc', 'help', 'deploy']
def romOut = layout.buildDirectory.dir('generated/rom')
var generateRom = tasks.register('generateRom') {
    outputs.dir romOut
    outputs.upToDateWhen { false }                      // (git knows what's changed, not Gradle)
    doLast {
        if (!new File(luaRepo, 'lib/net.lua').exists()) {
            throw new GradleException("ccnix's Lua isn't here for the ROM: git submodule update --init ccnix")
        }
        def git = { List<String> args ->
            def proc = new ProcessBuilder(['git', '-c', 'core.autocrlf=false', '-C', luaRepo.absolutePath] + args).start()
            def out = proc.inputStream.readAllBytes()
            def err = new String(proc.errorStream.readAllBytes())
            if (proc.waitFor() != 0) throw new GradleException("git ${args.join(' ')} in ${luaRepo}: ${err}")
            return out
        }
        def out = romOut.get().asFile
        project.delete(out)
        def rom = new File(out, 'ccnix-rom')
        rom.mkdirs()
        def tar = new File(temporaryDir, 'rom.tar')
        tar.bytes = git(['archive', '--format=tar', 'HEAD', '--'] + romPaths)
        project.copy {
            from project.tarTree(tar)
            into rom
        }
        def names = new String(git(['ls-tree', '-r', '--name-only', '-z', 'HEAD', '--'] + romPaths), 'UTF-8').split('\u0000')
        new File(rom, '.index').setText(names.findAll { it }.join('\n') + '\n', 'UTF-8')
        def commit = new String(git(['rev-parse', 'HEAD'])).trim()
        def time = new String(git(['log', '-1', '--format=%ct', 'HEAD'])).trim()
        new File(out, 'ccnix-rom.properties').setText(
            "commit=${commit}\ndate=${time}\nurl=${rom_url}\nbranch=${rom_branch}\n", 'UTF-8')
    }
}
sourceSets.main.resources.srcDir generateRom

tasks.named('jar') {
    from('LICENSE') { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}
